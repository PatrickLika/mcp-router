# The MCP servers that sit behind the router. Not secret: tokens are named
# here by the environment variable that holds them, and live in the
# mcp-router-secrets Secret (see README).
#
# Each server's tools are exposed to Claude as <name>_<tool>.
# An upstream whose token is not set is skipped with a warning, so adding one
# here before creating its token is harmless.
upstreams:
  # Roadmap step 2: Home Assistant's built-in MCP Server integration.
  # Disabled: Home Assistant runs on Home Assistant OS on the Pi 5 (not in
  # this cluster) and is already connected to Claude as its own "Home
  # Assistant" connector. Mounting it here too would show every HA tool twice.
  # To move it behind the router: remove that connector in Claude, set
  # enabled: true, and add HA_TOKEN (a long-lived access token from an HA
  # user) to the mcp-router-secrets Secret.
  - name: ha
    url: http://192.168.3.34:8123/api/mcp
    token_env: HA_TOKEN
    enabled: false

  # Roadmap step 1: the notes repo, through GitHub's own hosted MCP server.
  # /x/repos limits it to the file and repo tools. Token: a fine-grained PAT
  # that can only see the notes repo (Contents: read and write).
  - name: notes
    url: https://api.githubcopilot.com/mcp/x/repos
    token_env: GITHUB_NOTES_TOKEN
