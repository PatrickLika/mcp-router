# Apply ONCE, by hand, after the first image build has been merged:
#
#   kubectl apply -f argocd/application.yaml
#
# After that, everything is git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-router
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/PatrickLika/mcp-router.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
